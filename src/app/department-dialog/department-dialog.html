<h2 mat-dialog-title>
  @if (data) {
    Edit Department
  } @else {
    Add Department
  }
</h2>

<mat-dialog-content>

  <form id="departmentForm" (ngSubmit)="save()">

    <!-- Department Name -->
    <mat-form-field appearance="outline">
      <mat-label>Department Name</mat-label>

      <input
        matInput
        name="name"
        [(ngModel)]="name"
        required
      />
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>

      <textarea
        matInput
        name="description"
        [(ngModel)]="description"
        rows="3"
        required>
      </textarea>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    matButton="outlined"
    type="button"
    (click)="cancel()">
    Cancel
  </button>

  <button
    matButton="filled"
    type="submit"
    form="departmentForm">
    @if (data) {
      Save Changes
    } @else {
      Add Department
    }
  </button>

</mat-dialog-actions>
