<h2 mat-dialog-title>
  @if (data) {
    Edit Employee
  } @else {
    Add Employee
  }
</h2>

<mat-dialog-content>

  <form id="employeeForm" (ngSubmit)="save()">

    <!-- First Name -->
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input
        matInput
        name="fName"
        [(ngModel)]="fName"
        required
      />
    </mat-form-field>

    <!-- Last Name -->
    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input
        matInput
        name="lName"
        [(ngModel)]="lName"
        required
      />
    </mat-form-field>

    <!-- Department -->
<mat-form-field appearance="outline">
  <mat-label>Department</mat-label>

  <mat-select
    name="departmentId"
    [ngModel]="departmentId()"
    (ngModelChange)="onDepartmentChange($event)"
    required
  >
    @for (department of departments(); track department.id) {
      <mat-option [value]="department.id">
        {{ department.name }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>

<!-- Job Title -->
<mat-form-field appearance="outline">
  <mat-label>Job Title</mat-label>

  <mat-select
    name="jobTitleId"
    [(ngModel)]="jobTitleId"
    [disabled]="departmentId() === null"
    required
  >
    @for (job of filteredJobTitles(); track job.id) {
      <mat-option [value]="job.id">
        {{ job.name }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>

    <!-- Salary -->
    <mat-form-field appearance="outline">
      <mat-label>Salary</mat-label>
      <input
        matInput
        type="number"
        name="salary"
        [(ngModel)]="salary"
        min="1"
        max="100000"
        required
      />
      <span matTextSuffix>SAR</span>
    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" type="button" (click)="cancel()">
    Cancel
  </button>

  <button matButton="filled" type="submit" form="employeeForm">
    @if (data) {
      Save Changes
    } @else {
      Add Employee
    }
  </button>
</mat-dialog-actions>
