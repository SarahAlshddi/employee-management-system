<div class="login-container">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input
        matInput
        name="username"
        [(ngModel)]="username"
        required
      />
    </mat-form-field>

    <button mat-flat-button type="submit">
      Login
    </button>

    @if (errorMessage) {
      <p style="color: red">{{ errorMessage }}</p>
    }
  </form>
</div>
