@if (auth.isLoggedIn()) {

  <div class="app-layout">

    <app-header />

    <mat-sidenav-container>

      <mat-sidenav mode="side" opened>
        <app-sidebar />
      </mat-sidenav>

      <mat-sidenav-content>
        <router-outlet />
      </mat-sidenav-content>

    </mat-sidenav-container>

    <app-footer />

  </div>

} @else {

  <router-outlet />

}
