<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  Are you sure you want to delete
  <strong>{{ data.name }}</strong>?
</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    matButton="outlined"
    type="button"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    matButton="filled"
    type="button"
    (click)="confirm()"
  >
    Delete
  </button>

</mat-dialog-actions>
