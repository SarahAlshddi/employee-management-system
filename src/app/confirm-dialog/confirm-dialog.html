<h2 mat-dialog-title>Delete Employee</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete
    <strong>{{ data.name }}</strong>?
  </p>

  <p>This action cannot be undone.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    matButton="outlined"
    type="button"
    (click)="cancel()">
    Cancel
  </button>

  <button
    matButton="filled"
    type="button"
    (click)="confirm()">
    Delete
  </button>

</mat-dialog-actions>
