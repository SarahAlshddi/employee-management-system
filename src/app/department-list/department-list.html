<div class="department-container">

  <section class="list-section">

    <!-- Header -->
    <div class="departments-header">

      <div class="header-info">
        <h2>Departments</h2>

        <p class="department-count">
          Total Departments: {{ departmentsList().length }}
        </p>
      </div>

      <button
        matButton="filled"
        class="add-button"
        type="button"
        (click)="openAddDialog()"
      >
        <mat-icon>add</mat-icon>
        Add Department
      </button>

    </div>

    <!-- Search -->
    <div class="search-container">

      <mat-form-field
        appearance="outline"
        class="search-field"
      >

        <mat-label>Search Departments</mat-label>

        <mat-icon matPrefix>search</mat-icon>

        <input
          matInput
          type="text"
          placeholder="Search by name or description"
          (input)="applyFilter($event)"
        />

      </mat-form-field>

    </div>

    <!-- Table -->
    <div class="table-container">

      <table mat-table [dataSource]="dataSource">

        <!-- ID Column -->
        <ng-container matColumnDef="id">

          <th mat-header-cell *matHeaderCellDef>
            ID
          </th>

          <td mat-cell *matCellDef="let department">
            {{ department.id }}
          </td>

        </ng-container>

        <!-- Department Name Column -->
        <ng-container matColumnDef="name">

          <th mat-header-cell *matHeaderCellDef>
            Department Name
          </th>

          <td mat-cell *matCellDef="let department">
            {{ department.name }}
          </td>

        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">

          <th mat-header-cell *matHeaderCellDef>
            Description
          </th>

          <td mat-cell *matCellDef="let department">
            {{ department.description }}
          </td>

        </ng-container>

        <!-- Employees Count Column -->
        <ng-container matColumnDef="employeesCount">

          <th mat-header-cell *matHeaderCellDef>
            Employees
          </th>

          <td mat-cell *matCellDef="let department">
            {{ employeeCounts().get(department.id) ?? 0 }}
          </td>

        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">

          <th mat-header-cell *matHeaderCellDef>
            Actions
          </th>

          <td mat-cell *matCellDef="let department">

            <div class="action-buttons">

              <!-- Edit Button -->
              <button
                matIconButton
                class="edit-button"
                type="button"
                aria-label="Edit department"
                (click)="editDepartment(department)"
              >
                <mat-icon>edit</mat-icon>
              </button>

              <!-- Delete Button -->
              <button
                matIconButton
                class="delete-button"
                type="button"
                aria-label="Delete department"
                (click)="deleteDepartment(department)"
              >
                <mat-icon>delete_outline</mat-icon>
              </button>

            </div>

          </td>

        </ng-container>

        <!-- Header Row -->
        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>

        <!-- Data Rows -->
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns">
        </tr>

        <!-- Empty State -->
        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell empty-message"
            [attr.colspan]="displayedColumns.length"
          >
            No departments found.
          </td>
        </tr>

      </table>

    </div>

    <!-- Paginator -->
    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>

  </section>

</div>
