<div class="department-container">

  <!-- Header -->
  <div class="departments-header">

    <h2>Departments</h2>

    <button
      matButton="filled"
      type="button"
      (click)="openAddDialog()"
    >
      <mat-icon>add</mat-icon>
      Add Department
    </button>

  </div>

  <!-- Total Count -->
  <p>
    Total Departments: {{ departmentsList().length }}
  </p>

  <!-- Search -->
  <mat-form-field appearance="outline">

    <mat-label>Search Departments</mat-label>

    <mat-icon matPrefix>search</mat-icon>

    <input
      matInput
      type="text"
      placeholder="Search by name or description"
      (input)="applyFilter($event)"
    />

  </mat-form-field>

  <!-- Table -->
  <table mat-table [dataSource]="dataSource">

    <!-- ID Column -->
    <ng-container matColumnDef="id">

      <th mat-header-cell *matHeaderCellDef>ID</th>

      <td mat-cell *matCellDef="let department">
        {{ department.id }}
      </td>

    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">

      <th mat-header-cell *matHeaderCellDef>
        Department Name
      </th>

      <td mat-cell *matCellDef="let department">
        {{ department.name }}
      </td>

    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">

      <th mat-header-cell *matHeaderCellDef>
        Description
      </th>

      <td mat-cell *matCellDef="let department">
        {{ department.description }}
      </td>

    </ng-container>
<!-- Employees Count -->
<ng-container matColumnDef="employeesCount">
  <th mat-header-cell *matHeaderCellDef>Employees</th>

  <td mat-cell *matCellDef="let department">
    {{ employeeCounts().get(department.id) ?? 0 }}
  </td>
</ng-container>
    <!-- Actions Column -->
    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let department">

        <button
          matIconButton
          type="button"
          aria-label="Edit department"
          (click)="editDepartment(department)"
        >
          <mat-icon>edit</mat-icon>
        </button>

        <button
          matIconButton
          type="button"
          aria-label="Delete department"
          (click)="deleteDepartment(department)"
        >
          <mat-icon>delete</mat-icon>
        </button>

      </td>

    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <!-- Empty State -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        No departments found.
      </td>
    </tr>

  </table>

  <!-- Pagination -->
  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
  </mat-paginator>

</div>
